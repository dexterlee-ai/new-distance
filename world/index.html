<title>新距離｜決策智慧 2026 世界版</title>
<meta name="description" content="把 dentsu《決策智慧 2026｜Agentic 時代：重塑品牌與人的真實距離》22 篇文章畫成一座世界：品牌在岸上，人在中心，中間是 AI 代理之海。越往中心，離人越近。">

<body>
<canvas id="world" aria-hidden="true"></canvas>
<div class="veil" id="veil"></div>
<p class="sr" id="world-desc">一座手繪風格的圓形世界：中心是一朵由消費者數位分身組成的向日葵（CCS 5,000 份以上有效樣本），外圍依序是人心之地、AI 代理之海與組織之岸。每一區用一座會動的裝置呈現一組文章的核心概念。以下所有內容都有文字版本。</p>

<header class="top">
  <a class="lockup" href="#/" title="回到開場">
    <b class="iris-text">決策智慧 2026</b>
    <span>新距離 · The New Distance</span>
  </a>
  <div class="top-r">
    <nav class="nav" aria-label="主要">
      <button type="button" data-nav="map">地圖<small>Map</small></button>
      <button type="button" data-nav="route"><span class="long">我的</span>路線<small>Route</small></button>
      <button type="button" data-nav="index"><span class="long">22 篇</span>目錄<small>Index</small></button>
    </nav>
    <div class="tools" role="group" aria-label="聲音與動態">
      <button type="button" class="tgl" id="snd" aria-pressed="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2.5 6h2.3L8.2 3.1v9.8L4.8 10H2.5z" fill="currentColor"/><path class="i-on" d="M10.7 5.7a3.3 3.3 0 0 1 0 4.6M12.6 3.9a5.9 5.9 0 0 1 0 8.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path class="i-off" d="M10.9 6.2l3.4 3.6M14.3 6.2l-3.4 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="tl">聲音</span></button>
      <button type="button" class="tgl" id="motion"><svg class="i-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M5.2 3.6v8.8M10.8 3.6v8.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="i-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M5 3.2v9.6L12.9 8z" fill="currentColor"/></svg><span class="tl">暫停動態</span></button>
    </div>
  </div>
</header>

<div class="labels" id="labels" role="group" aria-label="世界地圖上的區域"></div>

<main id="ui"></main>

<aside class="panel" id="panel" aria-labelledby="panel-title" inert>
